<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Pyramid Task logical workflow architecture</title>
  <desc id="diagram-desc">An intent enters agent skills and a deterministic runtime. The runtime maintains an active demonstrable-increment loop and an append-only intent chronicle, connects clean Git commits as exact provenance, and publishes separate human and agent views.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2d3142"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2e5aa8"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2d3142" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1200" height="760" fill="#f5f5f5"/>
  <text x="48" y="52" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Pyramid Task system architecture</text>
  <text x="48" y="82" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">One active delivery loop, one durable causal record, and distinct views for action and understanding</text>

  <!-- Semantic zones -->
  <rect x="40" y="128" width="264" height="520" rx="16" fill="#ffffff" stroke="#d8dbe3"/>
  <rect x="328" y="128" width="524" height="520" rx="16" fill="#ffffff" stroke="#d8dbe3"/>
  <rect x="876" y="128" width="284" height="520" rx="16" fill="#ffffff" stroke="#d8dbe3"/>
  <text x="60" y="160" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">GUIDANCE</text>
  <text x="348" y="160" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">DETERMINISTIC DELIVERY SYSTEM</text>
  <text x="896" y="160" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">EVIDENCE &amp; OBSERVATION</text>

  <!-- Connectors render behind nodes -->
  <path d="M172 280 V332" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M272 396 H352 V264 H384" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M588 324 V352 H468 V372" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M568 420 H612" fill="none" stroke="#eb6c36" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M712 468 V500 H588 V324" fill="none" stroke="#eb6c36" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M792 264 H908" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M812 420 H860 V312 H908" fill="none" stroke="#eb6c36" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <path d="M1016 472 V344" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <path d="M1124 280 H1140 V556 H1124" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <path d="M468 468 V592 H908" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>

  <!-- Guidance nodes -->
  <g filter="url(#shadow)">
    <rect x="72" y="196" width="200" height="84" rx="12" fill="#ffffff" stroke="#7a8399" stroke-width="1.5"/>
    <text x="92" y="224" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Human + agent intent</text>
    <text x="92" y="248" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Desired outcome, constraints,</text>
    <text x="92" y="266" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">evidence, and authority</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="332" width="200" height="128" rx="12" fill="#ffffff" stroke="#7a8399" stroke-width="1.5"/>
    <text x="92" y="360" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Specialized skills</text>
    <text x="92" y="384" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Create · assess · simplify</text>
    <text x="92" y="404" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Take · update · audit</text>
    <text x="92" y="424" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Replan · lifecycle · history</text>
    <text x="92" y="446" fill="#7a8399" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Reasoning stays here</text>
  </g>

  <!-- Deterministic system nodes -->
  <g filter="url(#shadow)">
    <rect x="384" y="204" width="408" height="120" rx="14" fill="#fff8f4" stroke="#eb6c36" stroke-width="2.5"/>
    <text x="408" y="236" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Transactional runtime kernel</text>
    <text x="408" y="262" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Validates contracts · guards mutations · derives readiness</text>
    <text x="408" y="284" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Commits events · publishes atomic projections · recovers history</text>
    <rect x="408" y="296" width="156" height="18" rx="9" fill="#eb6c36"/>
    <text x="486" y="309" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">ENFORCED BOUNDARY</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="368" y="372" width="200" height="96" rx="12" fill="#ffffff" stroke="#7a8399" stroke-width="1.5"/>
    <text x="388" y="400" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Active delivery state</text>
    <text x="388" y="424" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Intent graph · ownership</text>
    <text x="388" y="444" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">assurance · ready frontier</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="612" y="372" width="200" height="96" rx="12" fill="#fff8f4" stroke="#eb6c36" stroke-width="1.5"/>
    <text x="632" y="400" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Workers + audits</text>
    <text x="632" y="424" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Implement one bounded task</text>
    <text x="632" y="444" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">prove a demonstrable increment</text>
  </g>
  <text x="590" y="536" text-anchor="middle" fill="#eb6c36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Repeat until the current candidate is runnable and accepted</text>

  <!-- Evidence and observation nodes -->
  <g filter="url(#shadow)">
    <rect x="908" y="204" width="216" height="140" rx="14" fill="#fff8f4" stroke="#eb6c36" stroke-width="2.5"/>
    <text x="928" y="232" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Intent Chronicle ledger</text>
    <text x="928" y="256" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Start → journey → closure</text>
    <text x="928" y="276" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Hash-linked semantic records</text>
    <text x="928" y="296" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Recoverable prepared append</text>
    <text x="928" y="320" fill="#eb6c36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">WHY · HOW · EVIDENCE · LIMITS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="908" y="384" width="216" height="88" rx="12" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
    <text x="928" y="412" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Clean Git commit</text>
    <text x="928" y="436" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Explicit exact-code binding</text>
    <text x="928" y="454" fill="#7a8399" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Established only when verified</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="908" y="520" width="216" height="96" rx="12" fill="#f3f7ff" stroke="#2e5aa8" stroke-width="2"/>
    <text x="928" y="548" fill="#2d3142" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Human + agent views</text>
    <text x="928" y="572" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Intent Observer · History</text>
    <text x="928" y="592" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Replay context · technical graph</text>
  </g>

  <!-- Legend -->
  <line x1="56" y1="704" x2="96" y2="704" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text x="108" y="708" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">validated control flow</text>
  <line x1="288" y1="704" x2="328" y2="704" stroke="#eb6c36" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="340" y="708" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">delivery and evidence loop</text>
  <line x1="548" y1="704" x2="588" y2="704" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <text x="600" y="708" fill="#4f5d75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">provenance or projection</text>
  <text x="1144" y="708" text-anchor="end" fill="#7a8399" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Canonical state stays small; durable history stays queryable.</text>
</svg>
